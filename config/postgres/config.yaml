---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: localdb-secret
  namespace: postgres
type: Opaque
data:
  username: bG9jYWx1c2Vy
  password: cEBzc3cwUmQh
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: localdb
  namespace: postgres
spec:
  # Pinned explicitly (rather than left to the operator's built-in
  # default) so it's deterministic across runs and so deploy.sh can read
  # it before any pod exists, to preload it into the kind node.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 1
  bootstrap:
    initdb:
      database: localdb
      owner: localuser
      secret:
        name: localdb-secret
  storage:
    size: 2Gi
  monitoring:
    enablePodMonitor: true
  postgresql:
    pg_hba:
    - host all all all md5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-services
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
data:
  5432: postgres/localdb-rw:5432
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: localdb-monitor
spec:
  selector:
    matchLabels:
      "cnpg.io/cluster": localdb
  podMetricsEndpoints:
  - port: metrics